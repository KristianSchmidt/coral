<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🇩🇰 Danish Players — World Series Bonzini 2026</title>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --border: #2a2d3a;
  --text: #e4e4e7;
  --text-dim: #9ca3af;
  --win: #22c55e;
  --loss: #ef4444;
  --accent: #3b82f6;
  --rank: #f59e0b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 1rem;
  max-width: 900px;
  margin: 0 auto;
}
header {
  text-align: center;
  padding: 2rem 1rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.5rem;
}
header h1 {
  font-size: 1.6rem;
  margin-bottom: 0.25rem;
}
header .meta {
  color: var(--text-dim);
  font-size: 0.9rem;
}
header .status {
  display: inline-block;
  margin-top: 0.5rem;
  padding: 0.2rem 0.8rem;
  border-radius: 999px;
  font-size: 0.85rem;
  background: var(--card);
  border: 1px solid var(--border);
}
.summary {
  display: flex;
  justify-content: center;
  gap: 2rem;
  margin-bottom: 1.5rem;
  color: var(--text-dim);
  font-size: 0.9rem;
}
.player-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 0.75rem;
  overflow: hidden;
}
.player-card > summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.75rem 1rem;
  cursor: pointer;
  user-select: none;
  list-style: none;
}
.player-card > summary::-webkit-details-marker { display: none; }
.player-card > summary::before {
  content: '▶';
  margin-right: 0.5rem;
  font-size: 0.7rem;
  color: var(--text-dim);
  transition: transform 0.2s;
}
.player-card[open] > summary::before { transform: rotate(90deg); }
.player-name { font-weight: 600; font-size: 1.05rem; }
.player-record { color: var(--text-dim); font-size: 0.85rem; white-space: nowrap; }
.competition {
  padding: 0.5rem 1rem 0.75rem;
  border-top: 1px solid var(--border);
}
.comp-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 0.4rem;
}
.comp-header h3 { font-size: 0.95rem; font-weight: 500; color: var(--accent); }
.comp-meta { font-size: 0.8rem; color: var(--text-dim); display: flex; gap: 0.5rem; align-items: baseline; }
.rank {
  background: var(--rank);
  color: #000;
  font-weight: 700;
  padding: 0.1rem 0.5rem;
  border-radius: 4px;
  font-size: 0.8rem;
}
.comp-record { white-space: nowrap; }
table.matches {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}
table.matches td { padding: 0.25rem 0.4rem; }
.phase-header td {
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--text-dim);
  padding-top: 0.5rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.round { color: var(--text-dim); width: 5rem; white-space: nowrap; }
.result { width: 2rem; text-align: center; font-weight: 700; border-radius: 3px; }
.result.win { color: var(--win); }
.result.loss { color: var(--loss); }
.result.pending { color: var(--text-dim); }
.opponent { }
.score { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-dim); white-space: nowrap; }
.dk-flag { font-size: 0.75rem; }
.forfeit { font-size: 0.7rem; color: var(--text-dim); font-style: italic; }
.qual-fold {
  margin: 0.25rem 0;
}
.qual-fold > summary {
  cursor: pointer;
  color: var(--text-dim);
  font-size: 0.8rem;
  padding: 0.25rem 0;
  user-select: none;
}
.qual-fold > summary:hover {
  color: var(--text);
}
.qual-fold table.matches {
  margin-top: 0.25rem;
}
.active-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
  margin-bottom: 1.5rem;
}
.active-section h2 {
  font-size: 1.1rem;
  margin-bottom: 0.75rem;
}
.active-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.4rem;
  padding: 0.3rem 0;
}
a.active-name {
  font-weight: 600;
  min-width: 10rem;
  margin-right: 0.5rem;
  color: var(--text);
  text-decoration: none;
}
a.active-name:hover {
  color: var(--accent);
}
.active-comp {
  font-size: 0.8rem;
  padding: 0.15rem 0.6rem;
  border-radius: 999px;
  white-space: nowrap;
}
.active-comp.playing {
  background: rgba(34, 197, 94, 0.15);
  border: 1px solid var(--win);
  color: var(--win);
}
.active-comp.live {
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid var(--loss);
  color: var(--loss);
  font-weight: 600;
}
.active-comp.waiting {
  background: rgba(245, 158, 11, 0.15);
  border: 1px solid var(--rank);
  color: var(--rank);
}
footer {
  text-align: center;
  padding: 2rem 0 1rem;
  color: var(--text-dim);
  font-size: 0.75rem;
}
footer a { color: var(--accent); text-decoration: none; }
.player-jump {
  text-align: center;
  margin-bottom: 1.5rem;
}
.player-jump select {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.5rem 1rem;
  font-size: 0.9rem;
  cursor: pointer;
  width: 100%;
  max-width: 400px;
}
.player-jump select:focus {
  outline: none;
  border-color: var(--accent);
}
.generated {
  color: var(--text-dim);
  font-size: 0.8rem;
  margin-top: 0.5rem;
}
@media (max-width: 600px) {
  body { padding: 0.5rem; }
  .comp-header { flex-direction: column; }
}
</style>
</head>
<body>

<header>
  <h1>🇩🇰 Danish Players</h1>
  <div class="meta">World Series Bonzini 2026 · 2026-06-04 — 2026-06-07</div>
  <div class="status">Created</div>
  <div class="generated">Report generated at 2026-06-01 13:02 CEST</div>
</header>

<div class="summary">
  <span>0 Danish players tracked</span>
  <span><a href="https://app.tablesoccer.org/p/7L5JM6" target="_blank">View on Coral ↗</a></span>
</div>

<div class="player-jump">
  <select onchange="if(this.value)location.hash=this.value;this.selectedIndex=0;">
    <option value="">Jump to player…</option>
    
  </select>
</div>





<footer>
  Data from <a href="https://app.tablesoccer.org/p/7L5JM6">app.tablesoccer.org</a>
</footer>

</body>
</html>
